name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: taskmanager_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U taskmanager -d taskmanager_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taskmanager:ci-only-database-password@localhost:5432/taskmanager_test
      TEST_DATABASE_URL: postgresql://taskmanager:ci-only-database-password@localhost:5432/taskmanager_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm run build:render
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
      - run: npm test
      - run: npm run db:deploy
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
